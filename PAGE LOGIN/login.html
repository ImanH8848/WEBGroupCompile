<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>ZARI | LOG IN</title>
   <link rel="stylesheet" href="login_.css">
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
   <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

   <!-- Close Button -->
   <a href="index.html" class="close-button">
     <i class="fas fa-times"></i>
   </a>

   <!-- Video Background -->
   <div class="video-background">
       <video autoplay muted loop playsinline>
           <source src="../assets/login_vid.mp4" type="video/mp4">
           <source src="assets/video.webm" type="video/webm">
           <img src="assets/fallback-image.jpg" alt="Background">
       </video>
       <div class="video-overlay"></div>
   </div>
   
   <!-- Main container -->
   <div class="container">
       <div class="content">
           <div class="header">
               <h1 class="zari-logo">ZARI</h1>
               <p class="welcome-text">WELCOME BACK</p>
           </div>

           <!-- Login Form -->
           <div class="form-section">
               <div class="form-container">
                   <form id="login-form" class="login-form">
                
                       <!-- Username Field -->
                       <div class="input-group">
                           <input type="text" id="username" placeholder="Username" required />
                           <i class="fas fa-user icon-right"></i>
                       </div>

                       <!-- Password Field -->
                       <div class="input-group">
                           <input type="password" placeholder="Password" id="password" required />
                           <i class="fas fa-lock icon-right" id="toggle-password" style="cursor: pointer;"></i>
                       </div>

                       <!-- Forgot Pass -->
                       <div class="form-footer1">
                            <label class="remember-me">
                                <input type="checkbox" id="remember-me" />
                                Remember Me
                            </label>
                            <a href="#">Forgot password?</a>
                        </div>

                       <!-- Submit Button -->
                       <button type="submit" class="btn">LOG IN</button>
                   </form>
                   <div class="form-footer">
                        <span>Create a new account <a href="../PAGE SIGNUP/signup.html"> Register</a></span>
                    </div>
               </div>
           </div>
       </div>
   </div>

   <!-- Footer -->
   <footer class="site-footer">
       <p>ZARI <time class="year">2025</time> &copy; All rights reserved.</p>
   </footer>

   <!-- Redirect Script -->
   <script>
        const loginForm = document.getElementById("login-form");
        const usernameInput = document.getElementById("username");
        const rememberCheckbox = document.getElementById("remember-me");

        // Prefill username if saved
        window.addEventListener("DOMContentLoaded", () => {
            const savedUsername = localStorage.getItem("rememberedUsername");
            if (savedUsername) {
                usernameInput.value = savedUsername;
                rememberCheckbox.checked = true;
            }
        });

        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();
            const username = usernameInput.value.trim();
            const password = document.getElementById("password").value.trim();
            if (username !== "" && password !== "") {
                if (rememberCheckbox.checked) {
                    localStorage.setItem("rememberedUsername", username);
                } else {
                    localStorage.removeItem("rememberedUsername");
                }
                window.location.href = "websucces_.html";
            } else {
                alert("Please fill in both username and password.");
            }
        });
   </script>

   <script>
       // Toggle password visibility
       const togglePassword = document.getElementById("toggle-password");
       const passwordInput = document.getElementById("password");

       togglePassword.addEventListener("click", () => {
           const isPassword = passwordInput.type === "password";
           passwordInput.type = isPassword ? "text" : "password";

           // Toggle icon style (lock vs unlock)
           togglePassword.classList.toggle("fa-lock");
           togglePassword.classList.toggle("fa-unlock");
       });
   </script>

</body>
</html>
