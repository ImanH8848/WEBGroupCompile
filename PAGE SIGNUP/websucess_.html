<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZARI | Access</title>
  <link rel="stylesheet" href="websuccess.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body>
  <div class="video-background">
    <video autoplay muted loop playsinline>
      <source src="../assets/login_vid.mp4" type="video/mp4">
    </video>
  </div>

  <div id="login-success-popup" class="popup-overlay">
    <div class="popup-box">
      <button class="close-btn">✕</button>
      <div class="welcome-text">WELCOME TO ZARI</div>
      <div class="divider"></div>
      <p class="offer"></p>
      <button class="ok-btn">CONTINUE</button>
      <p class="redirect-message"><span id="countdown">15</span></p>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <p>ZARI <time class="year">2025</time> &copy; All rights reserved.</p>
  </footer>

  <script src="websucess.js"></script>
</body>
</html>
